<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Chat</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .msg-wrapper {
            margin: 6px 0;
            padding: 6px 10px;
            border-radius: 8px;
        }
        .msg-wrapper.system-msg {
            color: rgba(255, 255, 255, 0.55);
            font-style: italic;
            font-size: 0.88em;
            text-align: center;
        }
        .msg-wrapper.user-msg {
            background: rgba(255, 255, 255, 0.07);
        }
        .msg-username {
            font-weight: 700;
            color: #7dd3fc;
            margin-right: 8px;
            font-size: 0.9em;
        }
        .msg-time {
            font-size: 0.75em;
            color: rgba(255,255,255,0.4);
            margin-left: 8px;
        }
        .msg-content {
            color: #f1f5f9;
        }
    </style>
</head>
<body>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    
    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100">
            <div class="col-md-8 col-xl-6 chat">
                <div class="card">
                    <div class="card-header msg_head">
                        <div class="d-flex bd-highlight">
                            <div class="user_info">
                                <span>Serveur Général</span>
                                <small style="color:rgba(255,255,255,0.6); margin-left:10px;">
                                    connecté en tant que <strong>{{ username }}</strong>
                                </small>
                            </div>
                            <div class="logout">
                                <a href="main" class="btn btn-secondary">Retour</a>
                                <a href="{{ url_for('logout') }}" class="btn btn-danger">Se déconnecter</a>
                            </div>
                        </div>
                    </div>
                    <div class="card-body msg_card_body" id="messages">
                    </div>
                    <div class="card-footer">
                        <div class="input-group">
                            <textarea id="messageContent" class="form-control type_msg" placeholder="Tapez votre message..."></textarea>
                            <div class="input-group-append">
                                <span class="input-group-text send_btn" id="submit"><i class="fas fa-location-arrow"></i></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script type="text/javascript">
        var socket = io();
        
        socket.on('connect', function() {
            console.log('Connecté au serveur');
        });
        
        socket.on('disconnect', function() {
            console.log('Déconnecté du serveur');
        });
        
        document.addEventListener("DOMContentLoaded", function () {
            var btn = document.getElementById("submit");
            var input = document.getElementById("messageContent");
            var messages = document.getElementById("messages");
            
            function getTime() {
                var today = new Date();
                return today.getHours().toString().padStart(2,'0') + ":"
                     + today.getMinutes().toString().padStart(2,'0') + ":"
                     + today.getSeconds().toString().padStart(2,'0');
            }

            function sendMessage() {
                var message = input.value.trim();
                if (message) {
                    socket.emit("message", message);
                    input.value = "";
                }
            }
            
            btn.addEventListener("click", function (event) {
                event.preventDefault();
                sendMessage();
            });
            
            input.addEventListener("keypress", function (e) {
                if (e.key === "Enter" && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            socket.on("server response", function (data) {
                var wrapper = document.createElement("div");

                if (data.type === "system") {
                    wrapper.className = "msg-wrapper system-msg";
                    wrapper.textContent = data.content;
                } else {
                    wrapper.className = "msg-wrapper user-msg";

                    var contentHtml;
                    if (isImageUrl(data.content)) {
                        // Render as image — no escaping needed, we control the attribute
                        var safeUrl = data.content.trim().replace(/"/g, '%22');
                        contentHtml = '<img src="' + safeUrl + '" '
                            + 'style="max-width:320px; max-height:240px; border-radius:8px; margin-top:6px; display:block;" '
                            + 'alt="image" '
                            + 'onerror="this.replaceWith(document.createTextNode(\'⚠️ Image non chargeable\'))" />';
                    } else {
                        contentHtml = '<span class="msg-content">' + escapeHtml(data.content) + '</span>';
                    }

                    wrapper.innerHTML =
                        '<span class="msg-username">' + escapeHtml(data.username) + '</span>' +
                        contentHtml +
                        '<span class="msg-time">' + getTime() + '</span>';
                }

                messages.appendChild(wrapper);
                wrapper.scrollIntoView({ behavior: "smooth" });
            });

            function isImageUrl(text) {
                var t = text.trim();
                return /^https?:\/\/.+\.(png|jpe?g|gif|webp|svg|bmp|ico)(\?.*)?$/i.test(t);
            }

            function escapeHtml(text) {
                return text
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }
        });
    </script>
</body>
</html>
